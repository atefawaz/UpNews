name: Daily News Digest

# Runs automatically every day, and lets you trigger it manually from
# the GitHub "Actions" tab to test it any time.
on:
  schedule:
    # Cron syntax is in UTC. 7:30 UTC ≈ 10:30am Beirut time.
    # Adjust the hour to whenever you want your digest to land.
    - cron: "30 7 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in GitHub

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore yesterday's seen-items state so we don't re-send
      # the same stories every day. GitHub Actions runners are
      # fresh each time, so we cache state.json between runs.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: news-bot-state-${{ github.run_id }}
          restore-keys: |
            news-bot-state-

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 news_bot.py

# ── SETUP ──────────────────────────────────────────────────────────
# 1. Push this repo to GitHub.
# 2. Go to your repo -> Settings -> Secrets and variables -> Actions.
# 3. Add two repository secrets:
#      TELEGRAM_BOT_TOKEN = your real bot token
#      TELEGRAM_CHAT_ID   = your real chat id
# 4. Go to the "Actions" tab -> "Daily News Digest" -> "Run workflow"
#    to test it manually before waiting for the schedule.
